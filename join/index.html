<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sanady · ADHD Support — Join the founding list</title>
<meta name="description" content="Sanady is a voice-first AI companion for adults with ADHD. Join the founding list.">
<meta property="og:title" content="Sanady · ADHD Support">
<meta property="og:description" content="Say everything on your mind. Sanady sorts it, reminds you at the right moment, and starts the first small step with you.">
<meta property="og:image" content="https://nrg1c3.github.io/join/og.png">
<meta name="theme-color" content="#101326">
<link rel="icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#101326;--card:#1A1E3A;--line:#2F3560;--ink:#F3F4FB;--mut:#A9AECF;--pri:#FFD24C;--onpri:#1B1530;--ok:#3FB28A;--red:#E0645A}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:Inter,system-ui,sans-serif;line-height:1.55;font-size:17px;padding:0 16px 48px}
html[lang=ar] body{font-family:Cairo,Tahoma,sans-serif}
.wrap{max-width:560px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 0}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px}.brand img{width:40px;height:40px;border-radius:10px}
select.lang{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font:inherit;font-size:15px}
h1{font-size:clamp(28px,7vw,38px);line-height:1.2;margin:8px 0 12px;font-weight:800}
h2{font-size:22px;margin:0 0 6px;line-height:1.3}
p{margin:0 0 12px}.mut{color:var(--mut);font-size:15px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;margin:16px 0}
ul.why{list-style:none;padding:0;margin:0 0 4px}ul.why li{display:flex;gap:10px;margin:10px 0}ul.why b{color:var(--pri)}
.btn{display:block;width:100%;border:0;border-radius:14px;background:var(--pri);color:var(--onpri);font:inherit;font-weight:800;font-size:18px;padding:15px;cursor:pointer;margin-top:14px;text-align:center;text-decoration:none}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);font-weight:600}
.btn:disabled{opacity:.5}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.chip{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:10px 14px;font:inherit;font-size:15px;cursor:pointer}
.chip.on{background:var(--pri);color:var(--onpri);border-color:var(--pri);font-weight:600}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:6px 0 16px}.scale button{padding:10px 0;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--ink);font:inherit;font-size:16px;cursor:pointer}.scale button.on{background:var(--pri);color:var(--onpri);border-color:var(--pri);font-weight:800}
.ends{display:flex;justify-content:space-between;font-size:13px;color:var(--mut);margin-top:-12px;margin-bottom:14px}
.nps{grid-template-columns:repeat(11,1fr)}.nps button{font-size:14px;padding:9px 0}
label.f{display:block;margin:12px 0 4px;font-weight:600}
input[type=text],input[type=email],input[type=number],select.f,textarea{width:100%;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:12px;font:inherit}
textarea{min-height:80px}
.check{display:flex;gap:10px;align-items:flex-start;margin:12px 0;font-size:15px}.check input{margin-top:5px;width:20px;height:20px;flex:none}
.bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin:4px 0 0}.bar i{display:block;height:100%;background:var(--pri);width:0;transition:width .3s}
.price{font-size:34px;font-weight:800;color:var(--pri)}
.hp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
.err{color:var(--red);font-size:15px;min-height:1em}
.step{display:none}.step.on{display:block}
footer{margin-top:28px;font-size:13px;color:var(--mut);text-align:center}
</style>
</head>
<body>
<div class="wrap">
<header><div class="brand"><img src="icon.png" alt=""><span>Sanady</span></div>
<select class="lang" id="lang" aria-label="Language"><option value="en">English</option><option value="ar">العربية</option><option value="fr">Français</option><option value="es">Español</option><option value="de">Deutsch</option></select></header>
<div class="bar" aria-hidden="true"><i id="prog"></i></div>

<!-- 0: intro -->
<section class="step on" data-s="0">
 <h1 data-t="h1"></h1><p data-t="lead"></p>
 <div class="card"><ul class="why"><li>🎙️ <span data-t="w1"></span></li><li>⏰ <span data-t="w2"></span></li><li>🪜 <span data-t="w3"></span></li><li>🤖 <span data-t="w4"></span></li><li>🔒 <span data-t="w5"></span></li></ul></div>
 <p class="mut" data-t="founding"></p>
 <button class="btn" data-next data-t="start"></button>
 <p class="mut" style="text-align:center;margin-top:10px" data-t="time"></p>
</section>

<!-- 1: about you -->
<section class="step" data-s="1">
 <h2 data-t="q_who"></h2>
 <div class="chips" data-one="who"><button class="chip" data-v="diagnosed" data-t="who_d"></button><button class="chip" data-v="suspect" data-t="who_s"></button><button class="chip" data-v="carer" data-t="who_c"></button></div>
 <label class="f" for="country" data-t="q_country"></label>
 <select class="f" id="country"></select>
 <label class="check"><input type="checkbox" id="adult"><span data-t="adult"></span></label>
 <p class="err" id="e1"></p><button class="btn" data-next data-t="next"></button>
</section>

<!-- 2: what is hard -->
<section class="step" data-s="2">
 <h2 data-t="q_hard"></h2><p class="mut" data-t="pick_any"></p>
 <div class="chips" data-many="hard">
  <button class="chip" data-v="start" data-t="h_start"></button><button class="chip" data-v="forget" data-t="h_forget"></button><button class="chip" data-v="time" data-t="h_time"></button>
  <button class="chip" data-v="money" data-t="h_money"></button><button class="chip" data-v="big" data-t="h_big"></button><button class="chip" data-v="home" data-t="h_home"></button>
  <button class="chip" data-v="overwhelm" data-t="h_over"></button><button class="chip" data-v="reply" data-t="h_reply"></button></div>
 <p class="err" id="e2"></p><button class="btn" data-next data-t="next"></button>
</section>

<!-- 3: ratings (also used one month later) -->
<section class="step" data-s="3">
 <h2 data-t="q_rate"></h2><p class="mut" data-t="rate_hint"></p>
 <div id="rates"></div>
 <p class="err" id="e3"></p><button class="btn" data-next data-t="next"></button>
</section>

<!-- 4: what you use now -->
<section class="step" data-s="4">
 <h2 data-t="q_use"></h2><p class="mut" data-t="pick_any"></p>
 <div class="chips" data-many="use">
  <button class="chip" data-v="nothing" data-t="u_nothing"></button><button class="chip" data-v="paper" data-t="u_paper"></button><button class="chip" data-v="reminders" data-t="u_rem"></button>
  <button class="chip" data-v="calendar" data-t="u_cal"></button><button class="chip" data-v="todo" data-t="u_todo"></button><button class="chip" data-v="adhd_app" data-t="u_app"></button>
  <button class="chip" data-v="meds" data-t="u_meds"></button><button class="chip" data-v="coach" data-t="u_coach"></button></div>
 <button class="btn" data-next data-t="next"></button>
</section>

<!-- 5: price -->
<section class="step" data-s="5">
 <h2 data-t="q_price"></h2>
 <div class="card" style="text-align:center"><div class="price" id="priceTxt"></div><p class="mut" data-t="price_note"></p></div>
 <div class="chips" data-one="price_ans"><button class="chip" data-v="yes" data-t="p_yes"></button><button class="chip" data-v="maybe" data-t="p_maybe"></button><button class="chip" data-v="expensive" data-t="p_exp"></button><button class="chip" data-v="no" data-t="p_no"></button></div>
 <label class="f" for="fair" data-t="q_fair"></label>
 <div style="display:flex;gap:8px;align-items:center"><input type="number" id="fair" inputmode="decimal" min="0" step="0.5" style="flex:1"><b id="cur"></b></div>
 <p class="err" id="e5"></p><button class="btn" data-next data-t="next"></button>
</section>

<!-- 6: contact -->
<section class="step" data-s="6">
 <h2 data-t="q_contact"></h2><p class="mut" data-t="contact_hint"></p>
 <label class="f" for="contact" data-t="contact_l"></label><input type="text" id="contact" autocomplete="email" dir="ltr">
 <label class="f" data-t="q_applang"></label>
 <div class="chips" data-one="applang"><button class="chip" data-v="ar" >العربية</button><button class="chip" data-v="en">English</button><button class="chip" data-v="fr">Français</button><button class="chip" data-v="es">Español</button><button class="chip" data-v="de">Deutsch</button><button class="chip" data-v="other" data-t="other"></button></div>
 <input class="hp" id="hp" tabindex="-1" autocomplete="off" aria-hidden="true">
 <label class="check"><input type="checkbox" id="consent"><span data-t="consent"></span></label>
 <p class="err" id="e6"></p><button class="btn" id="send" data-t="send"></button>
</section>

<!-- 7: done -->
<section class="step" data-s="7">
 <h1 data-t="done_h"></h1><p data-t="done_p"></p>
 <div class="card"><p data-t="done_next"></p></div>
 <button class="btn ghost" id="share" data-t="share"></button>
 <a class="btn ghost" href="https://nrg1c3.github.io/sayvo/" data-t="try"></a>
</section>

<!-- after one month -->
<section class="step" data-s="10">
 <h1 data-t="a_h"></h1><p data-t="a_p"></p>
 <h2 style="margin-top:18px" data-t="q_rate"></h2><div id="rates2"></div>
 <h2 data-t="a_nps"></h2><div class="scale nps" id="nps"></div><div class="ends"><span data-t="nps_lo"></span><span data-t="nps_hi"></span></div>
 <h2 data-t="a_keep"></h2>
 <div class="chips" data-one="keep"><button class="chip" data-v="yes" data-t="p_yes"></button><button class="chip" data-v="maybe" data-t="p_maybe"></button><button class="chip" data-v="no" data-t="k_no"></button></div>
 <h2 data-t="a_fav"></h2>
 <div class="chips" data-many="fav"><button class="chip" data-v="dump" data-t="f_dump"></button><button class="chip" data-v="alarms" data-t="f_alarm"></button><button class="chip" data-v="one" data-t="f_one"></button><button class="chip" data-v="agent" data-t="f_agent"></button><button class="chip" data-v="steps" data-t="f_steps"></button><button class="chip" data-v="with" data-t="f_with"></button><button class="chip" data-v="money" data-t="f_money"></button></div>
 <label class="f" for="better" data-t="a_better"></label><textarea id="better"></textarea>
 <p class="err" id="e10"></p><button class="btn" id="sendAfter" data-t="send"></button>
</section>
<section class="step" data-s="11"><h1 data-t="a_done"></h1><p data-t="a_done_p"></p></section>

<footer><span data-t="foot"></span></footer>
</div>

const TZC={'Africa/Cairo':'EG','Asia/Riyadh':'SA','Asia/Dubai':'AE','Asia/Kuwait':'KW','Asia/Qatar':'QA','Asia/Bahrain':'BH','Asia/Muscat':'OM','Asia/Amman':'JO','Asia/Beirut':'LB','Asia/Baghdad':'IQ','Africa/Casablanca':'MA','Africa/Algiers':'DZ','Africa/Tunis':'TN','Europe/London':'GB','Europe/Berlin':'DE','Europe/Paris':'FR','Europe/Madrid':'ES','America/New_York':'US','America/Chicago':'US','America/Los_Angeles':'US','America/Denver':'US','America/Toronto':'CA','Australia/Sydney':'AU','America/Mexico_City':'MX'};
// price test: each visitor sees one of three founding prices for their region; we compare how many say yes at each
const PRICES={eg:{cur:'EGP',arms:[49,99,149]},gcc:{cur:'USD',arms:[4.99,7.99,11.99]},world:{cur:'USD',arms:[3.99,6.99,9.99]}};
const GCC=['SA','AE','KW','QA','BH','OM'];
const $=id=>document.getElementById(id);const st=(k,v)=>{try{if(v===undefined)return localStorage.getItem('sj_'+k);localStorage.setItem('sj_'+k,v)}catch(e){return null}};
const rid=()=>{const a=crypto.getRandomValues(new Uint8Array(20));return Array.from(a,x=>'abcdefghijkmnpqrstuvwxyz23456789'[x%32]).join('')};
const q=new URLSearchParams(location.search);const AFTER=q.get('after');
let L=q.get('lang')||st('lang')||((navigator.language||'en').slice(0,2));if(!T[L])L='en';
const A={who:'',hard:[],use:[],price_ans:'',applang:'',keep:'',fav:[],r:{},r2:{},nps:null};
let step=AFTER?10:0;
const region=c=>c==='EG'?'eg':GCC.includes(c)?'gcc':'world';
const armFor=r=>{let a=st('arm_'+r);if(a==null){a=String(Math.floor(Math.random()*3));st('arm_'+r,a)}return +a};
const fmtP=(p,cur)=>cur==='EGP'?(L==='ar'?p+' جنيه':'EGP '+p):'$'+p.toFixed(2);
function t(k){return (T[L]&&T[L][k])||T.en[k]||''}
function apply(){document.documentElement.lang=L;document.documentElement.dir=L==='ar'?'rtl':'ltr';$('lang').value=L;
 document.querySelectorAll('[data-t]').forEach(e=>{const v=t(e.dataset.t);if(/<b>/.test(v))e.innerHTML=v;else e.textContent=v});
 const c=$('country').value;$('country').innerHTML=COUNTRIES.map(([k,en,ar])=>`<option value="${k}">${L==='ar'?ar:en}</option>`).join('');$('country').value=c||st('country')||TZC[Intl.DateTimeFormat().resolvedOptions().timeZone]||'XX';
 rates('rates','r');rates('rates2','r2');showPrice();if(!AFTER)document.title='Sanady · ADHD Support — '+t('start')}
function rates(host,key){const box=$(host);if(!box)return;box.innerHTML=['r1','r2','r3','r4'].map(k=>`<p style="margin:10px 0 4px"><b>${t(k)}</b></p><div class="scale" data-r="${k}">${[1,2,3,4,5].map(v=>`<button type="button" data-v="${v}" class="${A[key][k]===v?'on':''}">${v}</button>`).join('')}</div>`).join('')+`<div class="ends"><span>1</span><span>5</span></div>`;
 box.querySelectorAll('[data-r]').forEach(g=>g.querySelectorAll('button').forEach(b=>b.onclick=()=>{A[key][g.dataset.r]=+b.dataset.v;g.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b))}))}
function showPrice(){const r=region($('country').value),P=PRICES[r],p=P.arms[armFor(r)];$('priceTxt').textContent=fmtP(p,P.cur);$('cur').textContent=P.cur}
function go(n){step=n;document.querySelectorAll('.step').forEach(s=>s.classList.toggle('on',+s.dataset.s===n));$('prog').style.width=(n>=10?(n===11?100:50):Math.min(100,n/7*100))+'%';window.scrollTo(0,0)}
function err(id,k){$(id).textContent=k?t(k):''}
function check(n){
 if(n===1){if(!A.who)return err('e1','err_pick');if(!$('adult').checked)return err('e1','err_adult');err('e1');st('country',$('country').value);showPrice()}
 if(n===2){if(!A.hard.length)return err('e2','err_pick');err('e2')}
 if(n===3){if(Object.keys(A.r).length<4)return err('e3','err_rate');err('e3')}
 if(n===5){if(!A.price_ans)return err('e5','err_pick');err('e5')}
 return true}
document.querySelectorAll('[data-one]').forEach(g=>g.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{A[g.dataset.one]=b.dataset.v;g.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x===b))}));
document.querySelectorAll('[data-many]').forEach(g=>g.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{const a=A[g.dataset.many],v=b.dataset.v,i=a.indexOf(v);if(i<0)a.push(v);else a.splice(i,1);b.classList.toggle('on',i<0)}));
document.querySelectorAll('[data-next]').forEach(b=>b.onclick=()=>{if(check(step)===true)go(step+1)});
$('country').onchange=()=>{st('country',$('country').value);showPrice()};
$('lang').onchange=e=>{L=e.target.value;st('lang',L);apply()};
const nps=$('nps');nps.innerHTML=[...Array(11)].map((_,i)=>`<button type="button" data-v="${i}">${i}</button>`).join('');nps.querySelectorAll('button').forEach(b=>b.onclick=()=>{A.nps=+b.dataset.v;nps.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b))});
async function post(body){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.assign({k:'wasl-nrg-2026',hp:$('hp').value},body))});const j=await r.json().catch(()=>null);if(!r.ok||!j||!j.ok)throw new Error((j&&j.why)||'net');return j}
$('send').onclick=async()=>{const c=$('contact').value.trim();if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(c)&&c.replace(/\D/g,'').length<8)return err('e6','err_contact');if(!$('consent').checked)return err('e6','err_consent');err('e6');
 const country=$('country').value,r=region(country),P=PRICES[r],arm=armFor(r);let w=st('wid');if(!w){w=rid();st('wid',w)}
 $('send').disabled=true;try{await post({op:'join',w,consent:true,lang:L,country,region:r,arm:r+':'+P.cur+':'+P.arms[arm],price_ans:A.price_ans,fair:$('fair').value?($('fair').value+' '+P.cur):'',contact:c,src:(q.get('src')||'').slice(0,40),
  before:{who:A.who,hard:A.hard,use:A.use,r_start:A.r.r1,r_miss:A.r.r2,r_over:A.r.r3,r_control:A.r.r4,applang:A.applang||L}});st('joined','1');go(7)}
 catch(e){err('e6','err_net')}finally{$('send').disabled=false}};
$('share').onclick=async()=>{const u='https://nrg1c3.github.io/join/?src=share';const txt=t('share_txt')+' '+u;try{if(navigator.share){await navigator.share({title:'Sanady',text:t('share_txt'),url:u});return}}catch(e){}try{await navigator.clipboard.writeText(txt);$('share').textContent='✓'}catch(e){location.href='https://wa.me/?text='+encodeURIComponent(txt)}};
$('sendAfter').onclick=async()=>{if(Object.keys(A.r2).length<4)return err('e10','err_rate');if(A.nps==null||!A.keep)return err('e10','err_pick');err('e10');
 $('sendAfter').disabled=true;try{await post({op:'after',w:AFTER,after:{r_start:A.r2.r1,r_miss:A.r2.r2,r_over:A.r2.r3,r_control:A.r2.r4,nps:A.nps,keep:A.keep,fav:A.fav,better:$('better').value.trim().slice(0,300),lang:L}});go(11)}
 catch(e){err('e10','err_net')}finally{$('sendAfter').disabled=false}};
apply();if(AFTER&&!/^[a-z0-9]{16,32}$/.test(AFTER))location.search='';go(step);
